name: scp-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  # --- Python ---
  - python=3.14.6
  - pip
  - pyyaml=6.0.3
  - pandas=2.3.3
  - numpy=2.4.6
  - scanpy=1.12.1
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - openpyxl=3.1.5
  # --- R base ---
  - r-base=4.5.3
  # --- R packages (conda-forge) ---
  - r-optparse=1.8.2
  - r-yaml=2.3.12
  - r-dplyr=1.2.1
  - r-ggplot2=4.0.3
  - r-patchwork=1.3.2
  - r-rcolorbrewer=1.1_3
  - r-pheatmap=1.0.13
  - r-data.table=1.18.4
  - r-tibble=3.3.1
  - r-umap=0.2.10.0
  - r-limma=3.64.3
  - r-matrix=1.7_5
  # --- Following R packages need to be installed via R (see scripts/install_r_packages.R) ---
  # Bioconductor: DEP=1.28.0, SummarizedExperiment=1.38.1, Seurat=5.2.1, monocle3=1.4.27
  # GitHub: DEP2=0.5.28.2 (cilikes/DEP2)
  # CRAN: BiocManager=1.30.27, devtools=2.5.2, rmarkdown=2.31
